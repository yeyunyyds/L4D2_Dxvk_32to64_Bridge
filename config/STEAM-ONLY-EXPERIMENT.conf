# Replace these keys in your existing bin/.l4d2bridge/bridge.conf; restart game/Host.
# Steam profile based on the user-validated 0901 Presenter control.
# Preserve the existing IPC batch, backend, memory and retention settings.
client.testX86Server = False
client.forceWindowed = True
client.steamOverlayInput = True
server.steamOverlayInput = True
server.steamNativeInput = True
client.steamHookChainPassThrough = True
client.steamMouseCaptureHandoff = True
client.steamPollChainPassThrough = True
client.steamWorkshopAvailabilityProxy = True
server.steamWindowAdapter = True
server.presenterWindow = True
server.presenterInput = True
server.presenterHotkeyFallback = False
client.hookMessagePump = False
client.overrideCustomWinHooks = False
client.DirectInput.forward.mousePolicy = 0
client.DirectInput.forward.keyboardPolicy = 0
# Diagnostics stay off for normal gameplay; turn on temporarily if input regresses.
client.steamInputDiagnostics = False
server.steamInputDiagnostics = False
client.steamWindowDiagnostics = False
server.steamWindowDiagnostics = False
client.steamWebDiagnostics = False
logLevel = Info
logApiCalls = False
logServerCommands = False
# server.reshadeExternalInput is removed from this build; remove the old key.
