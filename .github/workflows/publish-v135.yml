# SPDX-License-Identifier: MIT
name: Publish v1.3.5 after verified main build
on:
  workflow_run:
    workflows: ['Build L4D2 D3D9 Bridge']
    types: [completed]
    branches: [main]
permissions:
  actions: read
  contents: write
jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      contains(github.event.workflow_run.head_commit.message, '[publish v1.3.5]')
    runs-on: ubuntu-latest
    concurrency:
      group: stable-release-v1.3.5
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN_ID: ${{ github.event.workflow_run.id }}
      SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha }}
      RELEASE_VERSION: '1.3.5'
      INCLUDE_L4N: 'true'
      L4N_BUILD_RUN_ID: ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify version and main provenance
        shell: bash
        run: |
          test "$(tr -d '\r\n' < VERSION)" = "$RELEASE_VERSION"
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)" = "$SOURCE_COMMIT"
          python -m unittest discover -s tests -p test_release_packaging.py
      - name: Create version-specific release draft
        shell: bash
        run: |
          if gh release view "v$RELEASE_VERSION" --json isDraft,targetCommitish > draft.json; then
            python -c 'import json,os; d=json.load(open("draft.json")); assert d["isDraft"] and d["targetCommitish"] == os.environ["SOURCE_COMMIT"]'
          else
            gh release create "v$RELEASE_VERSION" --draft --target "$SOURCE_COMMIT" --title "v$RELEASE_VERSION" --notes-file docs/RELEASE-V1.3.5-NOTES.md
          fi
      - name: Verify tested artifacts and publish
        run: python scripts/publish_release.py
