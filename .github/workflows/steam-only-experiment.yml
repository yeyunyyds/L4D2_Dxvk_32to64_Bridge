name: Steam-only Presenter experimental bridge
on:
  workflow_dispatch:
  push:
    branches: ['codex/steam-only-experiment']
    paths: ['.github/workflows/steam-only-experiment.yml', 'patches/ipc-c32.patch', 'experiments/ipc-c32/**', 'scripts/prepare_ipc_c32.py', 'scripts/package_ipc_c32.py', 'scripts/verify_steam_only_source.py', 'scripts/test_steam_capture_state.ps1', 'tests/remix_capture_state.cpp', 'config/STEAM-ONLY-EXPERIMENT.conf', 'config/bridge.conf']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: yeyunyyds/L4D2_Dxvk_32to64_Bridge
          ref: 8730d84b77c596efdabfad54b7458a8f0aeb01a4
          path: .deps/ipc-v2-pr6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned build tools
        run: python -m pip install meson==1.3.2 ninja==1.11.1.1
      - name: Prepare Steam-only production and verify removed paths
        run: |
          python scripts/prepare_bridge.py
          python scripts/prepare_ipc_c32.py
          python scripts/verify_steam_only_source.py --source .deps/dxvk-remix
      - name: Test actual Steam capture and notification helpers x86/x64
        shell: powershell
        run: ./scripts/test_steam_capture_state.ps1
      - name: Test actual production IPC across process architectures
        shell: powershell
        run: ./scripts/test_ipc_c32.ps1
      - name: Retained native regressions including Steam and invitation ABI
        shell: powershell
        run: |
          foreach ($suite in @('buffer_contract','volume_layout','device_reset','readback_recovery','input_hooks','overlay_presenter','steam_window_diagnostics','steam_web_diagnostics','steam_availability_diagnostics','steam_workshop_status','adapter_information','ati_texture_layout','command_queue')) {
            & powershell.exe -NoProfile -File "./scripts/test_$suite.ps1"
            if ($LASTEXITCODE -ne 0) { throw "Native regression failed: $suite" }
          }
      - name: Python contracts
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Compile and verify three matched Release binaries
        shell: powershell
        run: ./scripts/build_ipc_c32.ps1
      - name: Preserve package, checksums and native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: steam-only-experiment-${{ github.run_id }}
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
            work/ipc-c32-build.json
            work/ipc-c32-native/
            work/steam-only-source-verification.json
            .deps/dxvk-remix/bridge/_ipcC32_*/meson-logs/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
