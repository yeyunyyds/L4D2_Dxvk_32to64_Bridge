name: ReShade original-window experimental build
on:
  workflow_dispatch:
  push:
    branches: ['codex/reshade-external-input']
    paths: ['.github/workflows/reshade-external-input.yml', 'experiments/reshade-input/**', 'patches/reshade-input.patch', 'scripts/*reshade*', 'tests/reshade*']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: crosire/reshade
          ref: 1c952ec211a91b9ebbf9042e23a4a810feba44ff
          path: .deps/reshade
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: yeyunyyds/L4D2_Dxvk_32to64_Bridge
          ref: 8730d84b77c596efdabfad54b7458a8f0aeb01a4
          path: .deps/ipc-v2-pr6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned build tools
        run: python -m pip install meson==1.3.2 ninja==1.11.1.1
      - name: Prepare pinned sources
        run: |
          python scripts/prepare_bridge.py
          python scripts/prepare_ipc_c32.py
          python scripts/prepare_reshade_external.py
      - name: Actual input methods, wire boundaries and four process-architecture pairs
        shell: powershell
        run: ./scripts/test_reshade_external_input.ps1
      - name: Actual transport and retained-pointer regression
        shell: powershell
        run: ./scripts/test_ipc_c32.ps1
      - name: Existing native regression suites
        shell: powershell
        run: |
          foreach ($suite in @('buffer_contract','volume_layout','device_reset','readback_recovery','input_hooks','overlay_presenter','steam_window_diagnostics','steam_web_diagnostics','steam_availability_diagnostics','steam_workshop_status','adapter_information','ati_texture_layout','command_queue')) {
            & powershell.exe -NoProfile -File "./scripts/test_$suite.ps1"
            if ($LASTEXITCODE -ne 0) { throw "Native regression failed: $suite" }
          }
      - name: Python contracts
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Compile matched experimental Bridge
        shell: powershell
        run: ./scripts/build_ipc_c32.ps1
      - name: Compile public-source experimental ReShade x86 and x64
        shell: powershell
        run: ./scripts/build_reshade_external.ps1
      - name: Package and verify matched local-layer experiment
        run: python scripts/package_reshade_external.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reshade-experiment-${{ github.run_id }}
          path: |
            .deps/reshade-input-*/source.json
            .deps/reshade/bin/**/Release/*.dll
            dist/*.zip
            dist/RESHade-SHA256SUMS.txt
            work/ipc-c32-build.json
            work/ipc-c32-native/
            work/reshade-*-build.log
            .deps/dxvk-remix/bridge/_ipcC32_*/meson-logs/
          include-hidden-files: true
          retention-days: 30
