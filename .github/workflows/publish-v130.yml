name: Publish v1.3.0
on:
  push:
    branches: [codex/publish-v1.3.0]
    paths: [.github/workflows/publish-v130.yml]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TESTED_SHA: f6a059b758f9fcbf9c66ace73625aae9db34ad6a
      BUILD_RUN_ID: 38221697540
      RELEASE_VERSION: '1.3.0'
      INCLUDE_L4N: 'true'
      L4N_BUILD_RUN_ID: ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f6a059b758f9fcbf9c66ace73625aae9db34ad6a
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require the exact successful build on main and our unpublished release draft
        shell: bash
        run: |
          python - <<'PY'
          import json, os, subprocess
          repo = os.environ['GH_REPO']
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', 'repos/' + repo + '/' + path]))
          expected = os.environ['TESTED_SHA']
          build = api('actions/runs/' + os.environ['BUILD_RUN_ID'])
          if build['head_sha'] != expected or build['name'] != 'Build L4D2 D3D9 Bridge' or build['conclusion'] != 'success':
              raise RuntimeError('Matched successful build required')
          if api('git/ref/heads/main')['object']['sha'] != expected:
              raise RuntimeError('main must contain the exact tested source')
          draft = api('releases/410363787')
          if not draft['draft'] or draft['tag_name'] != 'v1.3.0' or draft['target_commitish'] != expected or draft['assets']:
              raise RuntimeError('Preserve any unrelated, published or populated release')
          PY
      - name: Publish the matched packages through the exact existing draft
        run: |
          python - <<'PY'
          import os, sys
          sys.path.insert(0, 'scripts')
          import publish_release
          original_api = publish_release.api
          def exact_draft_api(path):
              if path == 'repos/' + os.environ['GH_REPO'] + '/releases?per_page=100':
                  # Avoid a stale releases listing immediately after creation.
                  # The existing publisher still checks tag, draft and exact source.
                  return [original_api('repos/' + os.environ['GH_REPO'] + '/releases/410363787')]
              return original_api(path)
          publish_release.api = exact_draft_api
          publish_release.main()
          PY
