name: PrivateData compatibility fix
on:
  push:
    branches: ['fix/d3d9-private-data']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned build tools
        run: python -m pip install meson==1.3.2 ninja==1.11.1.1
      - name: Prepare pinned bridge and Full IPC overlays
        run: |
          python scripts/prepare_bridge.py
          python scripts/prepare_ipc_c32.py
          python scripts/prepare_ipc_full.py
      - name: PrivateData ownership and D3D9 API regression tests (x86 and x64)
        shell: powershell
        run: ./scripts/test_private_data.ps1
      - name: Build matched Full IPC development binaries
        shell: powershell
        run: ./scripts/build_ipc_full.ps1
      - name: Preserve matched update and build receipt
        uses: actions/upload-artifact@v4
        with:
          name: private-data-fix-${{ github.run_id }}
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
            work/ipc-full-build.json
          if-no-files-found: error
          retention-days: 30
