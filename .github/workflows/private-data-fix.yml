name: PrivateData compatibility fix
on:
  push:
    branches: ['fix/d3d9-private-data']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned build tools
        run: python -m pip install meson==1.3.2 ninja==1.11.1.1
      - name: Prepare canonical production Bridge source
        run: python scripts/prepare_bridge.py
      - name: PrivateData ownership and D3D9 API regression tests (x86 and x64)
        shell: powershell
        run: ./scripts/test_private_data.ps1
      - name: Download verified pinned DXVK build dependencies
        shell: pwsh
        run: |
          curl.exe --fail --location --retry 3 --max-time 90 https://github.com/doitsujin/dxvk/releases/download/v2.6.1/dxvk-2.6.1.tar.gz --output .deps/dxvk.tar.gz
          if ($LASTEXITCODE -ne 0) { throw 'DXVK download failed' }
          if ((Get-FileHash .deps/dxvk.tar.gz -Algorithm SHA256).Hash.ToLower() -ne '7ee0bef415910c943d3bda47d9d6821b9c8ca7a74f1e9f6151707d268cf3ce7f') { throw 'DXVK checksum mismatch' }
          tar -xzf .deps/dxvk.tar.gz -C .deps
          if ($LASTEXITCODE -ne 0) { throw 'DXVK extraction failed' }
      - name: Build matched production Bridge test binaries
        shell: powershell
        run: ./scripts/build_bridge.ps1 -DxvkDll .deps/dxvk-2.6.1/x64/d3d9.dll -Dxvk32Dll .deps/dxvk-2.6.1/x32/d3d9.dll -PatchOnly
      - name: Archive matched test update
        shell: pwsh
        run: |
          python -c "import json,pathlib; p=pathlib.Path('dist/l4d2-bridge-patch/BUILD-INFO.json'); d=json.loads(p.read_text()); d.update(distribution='experimental',status='AWAITING GAME VALIDATION'); p.write_text(json.dumps(d,indent=2)+'\n',encoding='utf-8')"
          if ($LASTEXITCODE -ne 0) { throw 'Test receipt update failed' }
          python -c "import shutil; shutil.make_archive('dist/l4d2-bridge-private-data-test','zip','dist/l4d2-bridge-patch')"
          if ($LASTEXITCODE -ne 0) { throw 'Test ZIP creation failed' }
          $zip = Get-Item dist/l4d2-bridge-private-data-test.zip
          $hash = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($zip.Name)" | Set-Content dist/SHA256SUMS.txt -Encoding ascii
      - name: Preserve matched update and build receipt
        uses: actions/upload-artifact@v4
        with:
          name: private-data-fix-${{ github.run_id }}
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
            work/release-build.json
          if-no-files-found: error
          retention-days: 30
