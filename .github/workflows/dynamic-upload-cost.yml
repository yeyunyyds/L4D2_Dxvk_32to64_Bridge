name: Investigate dynamic upload cost
on:
  push:
    branches: [codex/development-next]
    paths:
      - scripts/investigate_dynamic_upload.py
      - tests/dynamic_upload_support.h
      - tests/dynamic_upload_cases.cpp
      - .github/workflows/dynamic-upload-cost.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cost:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare pinned production sources
        run: python scripts/prepare_bridge.py
      - name: Run existing historical-content and error-contract regression
        shell: powershell
        run: ./scripts/test_buffer_contract.ps1
      - name: Run native Windows x86 cost investigation
        shell: powershell
        run: |
          . .deps/dxvk-remix/bridge/build_common.ps1
          SetupVS -Platform x86 -VcVarsVer '14.29'
          python scripts/investigate_dynamic_upload.py --output work/dynamic-upload-result.json
          if ($LASTEXITCODE -ne 0) { throw 'Upload cost investigation failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dynamic-upload-cost
          path: work/dynamic-upload-result.json
          if-no-files-found: warn
          retention-days: 14
