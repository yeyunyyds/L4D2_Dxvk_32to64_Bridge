name: Publish verified stable release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version without the v prefix
        required: true
        type: string
      build_run_id:
        description: Successful Build L4D2 D3D9 Bridge run containing release artifacts
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify artifacts and publish existing draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          INCLUDE_L4N: 'true'
        run: python scripts/publish_release.py
